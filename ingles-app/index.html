<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>Sem Frescura English</title>
<style>
  :root {
    --bg: #0f0f12;
    --panel: #18181d;
    --panel-2: #22222a;
    --line: #2e2e38;
    --text: #f2f2f5;
    --muted: #9a9aa8;
    --accent: #ff3d6e;
    --accent-2: #ffb020;
    --ok: #2ecc8f;
    --bad: #ff5a5a;
    --me: #2b2b38;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .logo { font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
  .logo span { color: var(--accent); }
  .stats { margin-left: auto; display: flex; gap: 12px; color: var(--muted); font-size: 13px; }
  .stats b { color: var(--accent-2); }
  .icon-btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px;
  }

  nav.tabs {
    display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button {
    background: none; border: 0; padding: 8px 12px; border-radius: 999px;
    color: var(--muted); white-space: nowrap;
  }
  nav.tabs button.active { background: var(--accent); color: #fff; font-weight: 600; }

  main { flex: 1; min-height: 0; display: flex; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }
  .scroll { overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; width: 100%; margin: 0 auto; }

  /* Chat */
  #chatLog { flex: 1; }
  .msg { display: flex; margin: 10px 0; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 14px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line);
    overflow-wrap: anywhere;
  }
  .msg.me .bubble { background: var(--me); border-color: transparent; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
  .en {
    display: inline; background: rgba(255,61,110,.14); color: #ffd0dc;
    border: 0; border-radius: 6px; padding: 1px 6px; font-weight: 600;
  }
  .en::after { content: " 🔊"; font-size: 11px; }
  .en:hover { background: rgba(255,61,110,.3); }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 8px; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font-size: 13px;
  }
  .chip:hover { border-color: var(--accent); }

  .composer {
    display: flex; gap: 8px; padding: 10px 16px 14px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  .composer textarea {
    flex: 1; resize: none; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; max-height: 140px; min-height: 44px;
  }
  .composer button {
    border: 0; border-radius: 12px; padding: 0 14px; min-width: 46px; font-size: 18px;
  }
  #sendBtn { background: var(--accent); color: #fff; }
  #micBtn { background: var(--panel-2); border: 1px solid var(--line); }
  #micBtn.rec { background: var(--bad); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .6; } }

  /* Trilha */
  .level { margin-bottom: 22px; }
  .level h2 { font-size: 16px; margin: 0 0 4px; }
  .level h2 small { color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; text-align: left;
  }
  .card:hover { border-color: var(--accent); }
  .card .t { font-weight: 600; }
  .card .d { color: var(--muted); font-size: 13px; }
  .card.done { border-color: var(--ok); }
  .card.done .t::after { content: " ✓"; color: var(--ok); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: var(--accent); color: #fff; margin-right: 6px;
  }

  /* Flashcards */
  .flash {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; cursor: pointer; user-select: none;
  }
  .flash .front { font-size: 28px; font-weight: 700; }
  .flash .back { margin-top: 12px; color: var(--accent-2); font-size: 18px; }
  .flash .ex { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.ok { border-color: var(--ok); }
  .btn.bad { border-color: var(--bad); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input, .field select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .deck-list { margin-top: 16px; }
  .deck-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }

  /* Modal */
  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px; width: min(480px, calc(100% - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin-top: 0; }
  .warn { background: rgba(255,176,32,.1); border: 1px solid rgba(255,176,32,.4); border-radius: 10px; padding: 10px; font-size: 13px; }

  @media (max-width: 560px) {
    .stats span.hide-sm { display: none; }
    .bubble { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Sem Frescura <span>English</span></div>
  <div class="stats">
    <span>🔥 <b id="streak">0</b><span class="hide-sm"> dias</span></span>
    <span>⭐ <b id="xp">0</b> XP</span>
    <span class="hide-sm">Nível <b id="lvlLabel">A1</b></span>
  </div>
  <button class="icon-btn" id="settingsBtn" title="Configurações">⚙️</button>
</header>

<nav class="tabs">
  <button data-view="chat" class="active">💬 Conversa</button>
  <button data-view="trilha">🗺️ Trilha</button>
  <button data-view="cards">🃏 Vocabulário</button>
</nav>

<main>
  <!-- CHAT -->
  <section class="view active" id="view-chat">
    <div class="scroll" id="chatLog"><div class="wrap" id="chatInner"></div></div>
    <div class="quick wrap" id="quick"></div>
    <div class="composer">
      <button id="micBtn" title="Falar em inglês">🎤</button>
      <textarea id="input" rows="1" placeholder="Escreve aí (em português ou inglês, foda-se)…"></textarea>
      <button id="sendBtn" title="Enviar">➤</button>
    </div>
  </section>

  <!-- TRILHA -->
  <section class="view" id="view-trilha">
    <div class="scroll"><div class="wrap" id="trilha"></div></div>
  </section>

  <!-- FLASHCARDS -->
  <section class="view" id="view-cards">
    <div class="scroll"><div class="wrap">
      <div class="row" style="margin:0 0 12px">
        <select class="btn" id="deckFilter"></select>
        <span class="muted" id="deckCount" style="align-self:center"></span>
      </div>
      <div class="flash" id="flash">
        <div class="front" id="fFront"></div>
        <div class="back" id="fBack" hidden></div>
        <div class="ex" id="fEx" hidden></div>
        <div class="muted" id="fHint" style="margin-top:12px">toca pra virar</div>
      </div>
      <div class="row">
        <button class="btn" id="fSpeak">🔊 Ouvir</button>
        <button class="btn bad" id="fBad">😵 Errei</button>
        <button class="btn ok" id="fGood">😎 Acertei</button>
        <button class="btn" id="fAsk">🤖 Explica essa</button>
      </div>

      <h3 style="margin-top:28px">Adicionar palavra/frase</h3>
      <div class="field"><label>Inglês</label><input id="newEn" placeholder="ex: I'm broke as hell"></div>
      <div class="field"><label>Português</label><input id="newPt" placeholder="ex: tô fodido de grana"></div>
      <div class="row"><button class="btn primary" id="addCard">Salvar</button>
        <button class="btn" id="genCards">✨ IA: gerar 10 do meu nível</button></div>
      <div class="deck-list" id="myCards"></div>
    </div></div>
  </section>
</main>

<dialog id="settings">
  <h3>⚙️ Configurações</h3>
  <div class="field">
    <label>Chave da API do Claude (Anthropic)</label>
    <input id="apiKey" type="password" placeholder="sk-ant-...">
    <span class="muted">Pegue em console.anthropic.com. Fica salva só neste navegador.</span>
  </div>
  <div class="field">
    <label>Seu nível</label>
    <select id="level">
      <option value="A1">A1 — Zero absoluto</option>
      <option value="A2">A2 — Básico</option>
      <option value="B1">B1 — Intermediário</option>
      <option value="B2">B2 — Intermediário avançado</option>
      <option value="C1">C1 — Avançado</option>
      <option value="C2">C2 — Pro / fluente</option>
    </select>
  </div>
  <div class="field">
    <label>Personalidade da professora</label>
    <select id="vibe">
      <option value="sem-filtro">🔥 Sem filtro — palavrão liberado</option>
      <option value="debochada">😏 Debochada — zoeira leve</option>
      <option value="educada">😇 Educada — modo tia da escola</option>
    </select>
  </div>
  <div class="field">
    <label>Modelo</label>
    <select id="model">
      <option value="claude-opus-5-5">Claude Opus 5.5 (melhor)</option>
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (rápido)</option>
      <option value="claude-haiku-5-5">Claude Haiku 5.5 (mais barato)</option>
    </select>
  </div>
  <div class="field">
    <label><input type="checkbox" id="autoSpeak"> Ler em voz alta as frases em inglês automaticamente</label>
  </div>
  <div class="warn">⚠️ Conteúdo adulto: no modo "sem filtro" a IA fala palavrão (sem ofensas preconceituosas). Use só se for maior de idade.</div>
  <div class="row" style="justify-content:space-between">
    <button class="btn" id="resetChat">🗑️ Limpar conversa</button>
    <button class="btn primary" id="saveSettings">Salvar</button>
  </div>
</dialog>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm";

/* ---------- Estado ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sfe:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("sfe:" + k, JSON.stringify(v)); } catch {} },
};

const state = {
  apiKey: store.get("apiKey", ""),
  level: store.get("level", "A1"),
  vibe: store.get("vibe", "sem-filtro"),
  model: store.get("model", "claude-opus-5-5"),
  autoSpeak: store.get("autoSpeak", false),
  history: store.get("history", []),
  xp: store.get("xp", 0),
  streak: store.get("streak", { days: 0, last: null }),
  done: store.get("done", []),
  myCards: store.get("myCards", []),
  box: store.get("box", {}), // repetição espaçada: id -> nível 0..5
};
let busy = false;

/* ---------- Currículo: do básico ao pro ---------- */
const CURRICULUM = [
  { lvl: "A1", name: "Zero absoluto", lessons: [
    ["a1-alfabeto", "Alfabeto e pronúncia", "Os sons que brasileiro sempre erra (th, r, h)"],
    ["a1-saudacoes", "Cumprimentos", "Hi, what's up, how you doing"],
    ["a1-tobe", "Verbo to be", "I am, you are, he is — a base de tudo"],
    ["a1-numeros", "Números, horas e datas", "Contar, perguntar hora e preço"],
    ["a1-pronomes", "Pronomes e possessivos", "I/me/my/mine sem se perder"],
    ["a1-presente", "Presente simples", "Rotina, do/does, don't/doesn't"],
    ["a1-palavras", "100 palavras essenciais", "O vocabulário que cobre metade das conversas"],
  ]},
  { lvl: "A2", name: "Básico", lessons: [
    ["a2-passado", "Passado simples", "Regulares, irregulares e o did"],
    ["a2-continuo", "Presente contínuo", "I'm doing / going to"],
    ["a2-comida", "Restaurante e comida", "Pedir comida sem passar vergonha"],
    ["a2-viagem", "Aeroporto e viagem", "Imigração, hotel, direções"],
    ["a2-perguntas", "Fazer perguntas", "What, where, why, how much, how long"],
    ["a2-preposicoes", "In, on, at", "As preposições que todo mundo erra"],
  ]},
  { lvl: "B1", name: "Intermediário", lessons: [
    ["b1-perfect", "Present perfect", "Have you ever...? O tempo que não existe em PT"],
    ["b1-futuro", "Futuro: will x going to", "Quando usar cada um"],
    ["b1-phrasal", "Phrasal verbs essenciais", "Get up, give up, figure out, hang out"],
    ["b1-condicional", "Condicionais 0, 1 e 2", "If I had money, I would..."],
    ["b1-girias", "Gírias do dia a dia", "Gonna, wanna, dude, chill, lit"],
    ["b1-trabalho", "Inglês pro trabalho", "E-mails, reuniões, small talk"],
  ]},
  { lvl: "B2", name: "Intermediário avançado", lessons: [
    ["b2-palavroes", "Palavrões e xingamentos", "Fuck, shit, damn — intensidade e quando usar"],
    ["b2-passiva", "Voz passiva", "It was made, it's been done"],
    ["b2-reported", "Discurso indireto", "He said that..."],
    ["b2-modais", "Modais avançados", "Should have, must have, could have"],
    ["b2-idioms", "Expressões idiomáticas", "Piece of cake, break a leg, spill the tea"],
    ["b2-listening", "Inglês falado de verdade", "Connected speech, reduções, sotaques"],
  ]},
  { lvl: "C1", name: "Avançado", lessons: [
    ["c1-argumentar", "Argumentar e debater", "Opinião com nuance e conectivos"],
    ["c1-inversao", "Inversão e ênfase", "Never have I ever, not only... but also"],
    ["c1-registro", "Formal x informal", "Mudar o tom conforme a situação"],
    ["c1-humor", "Humor, ironia e sarcasmo", "Entender a zoeira dos gringos"],
    ["c1-entrevista", "Entrevista de emprego", "Simulação completa com feedback"],
  ]},
  { lvl: "C2", name: "Pro / fluente", lessons: [
    ["c2-nativo", "Soar como nativo", "Collocations, ritmo e naturalidade"],
    ["c2-regional", "Inglês regional", "EUA x UK x Austrália, gírias de cada lugar"],
    ["c2-slang-pesado", "Slang pesado e internet", "Gírias de rua, memes e AAVE explicado com respeito"],
    ["c2-debate", "Debate sem dó", "A IA discorda de tudo e você se defende"],
    ["c2-escrita", "Escrita nível nativo", "Texto, e-mail e redação revisados linha a linha"],
  ]},
];

const MODES = [
  ["🗣️ Conversa livre", "Bora conversar em inglês sobre qualquer coisa. Puxa um assunto aí."],
  ["❓ Quiz", "Me faz um quiz de 5 perguntas do meu nível, uma de cada vez."],
  ["🎭 Roleplay", "Vamos fazer um roleplay: você escolhe uma situação real (bar, aeroporto, entrevista) e a gente encena em inglês."],
  ["🤬 Palavrões", "Me ensina palavrões e xingamentos em inglês, com intensidade e quando NÃO usar."],
  ["🔤 Palavra do dia", "Me ensina 5 palavras novas do meu nível com exemplos."],
  ["🎙️ Pronúncia", "Me dá uma frase pra eu treinar pronúncia. Vou falar no microfone e você corrige."],
  ["🔁 Traduz", "Vou mandar frases em português e você me ensina como um nativo falaria."],
];

const STARTER_CARDS = [
  ["A1", "Hello / Hi", "Olá / Oi", "Hi! How are you?"],
  ["A1", "Thank you", "Obrigado(a)", "Thank you so much!"],
  ["A1", "I don't know", "Eu não sei", "I don't know, man."],
  ["A1", "Where is the bathroom?", "Onde fica o banheiro?", "Excuse me, where is the bathroom?"],
  ["A1", "How much is it?", "Quanto custa?", "How much is this shirt?"],
  ["A1", "I'm hungry", "Tô com fome", "I'm so hungry right now."],
  ["A2", "I used to...", "Eu costumava...", "I used to play soccer."],
  ["A2", "Can I get...?", "Pode me ver...? (pedido)", "Can I get a coffee, please?"],
  ["A2", "I'm looking for...", "Tô procurando...", "I'm looking for the train station."],
  ["B1", "figure out", "descobrir / entender", "I can't figure out this problem."],
  ["B1", "hang out", "sair / ficar de rolê", "Wanna hang out tonight?"],
  ["B1", "gonna / wanna", "vou / quero (informal)", "I'm gonna grab a beer."],
  ["B1", "chill", "de boa / relaxado", "Chill, dude, it's fine."],
  ["B2", "What the hell?", "Que porra é essa? (leve)", "What the hell was that?"],
  ["B2", "I'm pissed", "Tô puto", "I'm so pissed at him."],
  ["B2", "No shit", "Jura? / Sério? (irônico)", "No shit, Sherlock."],
  ["B2", "Bullshit", "Mentira / papo furado", "That's total bullshit."],
  ["B2", "piece of cake", "moleza", "The test was a piece of cake."],
  ["C1", "I couldn't care less", "Tô cagando / não ligo nem um pouco", "Honestly, I couldn't care less."],
  ["C1", "to be on the fence", "estar em cima do muro", "I'm still on the fence about it."],
  ["C1", "spill the tea", "conta a fofoca", "Okay, spill the tea!"],
  ["C2", "to cut corners", "fazer nas coxas", "They cut corners on this project."],
  ["C2", "a far cry from", "muito longe de ser", "This is a far cry from what we expected."],
  ["C2", "get your shit together", "se organiza, porra", "Dude, get your shit together."],
].map(([lvl, en, pt, ex], i) => ({ id: "s" + i, lvl, en, pt, ex }));

/* ---------- Prompt da professora ---------- */
const VIBES = {
  "sem-filtro": `Você é a "Brenda", professora de inglês brasileira, audaciosa, debochada e SEM FILTRO. Fala palavrão à vontade (porra, caralho, puta merda, foda-se) como uma amiga zoeira de bar, zoa os erros do aluno com carinho e é engraçada pra caralho. Limites: nunca use ofensas racistas, homofóbicas, misóginas ou contra grupos; nunca humilhe de verdade — a zoeira é pra motivar. Quando o aluno pedir palavrões em inglês, ensine sem frescura (fuck, shit, damn, asshole, etc.), explicando intensidade, contexto e quando NÃO usar. Termos ofensivos contra grupos você explica que existem e por que são pesados, mas não fica repetindo.`,
  "debochada": `Você é a "Brenda", professora de inglês brasileira debochada e divertida. Faz piada, zoa os erros com carinho, pode usar palavrão leve de vez em quando (droga, merda, puta que pariu). Ensina palavrões em inglês se o aluno pedir.`,
  "educada": `Você é a "Brenda", professora de inglês brasileira simpática, paciente e encorajadora. Não usa palavrão, mas ensina gírias e palavrões em inglês de forma didática se o aluno pedir.`,
};

function systemPrompt() {
  return `${VIBES[state.vibe]}

Aluno: brasileiro, nível atual ${state.level} (CEFR). Você ensina de tudo, do básico ao nível nativo: palavras, frases, gramática, pronúncia, gírias, expressões, conversação, escrita e cultura.

Regras de ensino:
- Explique em português, mas faça o aluno PRATICAR inglês o tempo todo. Ajuste a quantidade de inglês ao nível (A1: quase tudo em PT; C2: quase tudo em inglês).
- Sempre que o aluno escrever em inglês, corrija os erros primeiro: mostre a versão certa, explique rapidinho o porquê e como um nativo falaria.
- Ensine em pedaços pequenos e termine quase sempre com uma pergunta, desafio ou exercício pro aluno responder.
- Para pronúncia, use aproximação em português (ex: "think" ≈ "fínk", com a língua entre os dentes).
- Em aulas da trilha: explique o conceito, dê exemplos, depois faça 3–5 exercícios um por um, corrigindo cada resposta. No final diga "✅ Aula concluída" e dê um resumo.
- IMPORTANTE: toda palavra ou frase em inglês que o aluno deva ouvir/aprender, coloque entre colchetes duplos assim: [[I'm starving]]. O app transforma isso num botão de áudio. Não use colchetes duplos para português.
- Respostas curtas e diretas (normalmente até 150 palavras), formatadas com markdown simples (negrito, listas). Nada de textão.`;
}

/* ---------- Utilidades ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function md(text) {
  let h = esc(text);
  h = h.replace(/\[\[(.+?)\]\]/g, (_, t) => `<button class="en" data-say="${t}">${t}</button>`);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, "$1<i>$2</i>");
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  const out = [];
  let list = null;
  for (const line of h.split("\n")) {
    const ul = line.match(/^\s*[-•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    const kind = ul ? "ul" : ol ? "ol" : null;
    if (kind) {
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${(ul || ol)[1]}</li>`);
      continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    if (/^#{1,4}\s/.test(line)) out.push(`<p><b>${line.replace(/^#+\s/, "")}</b></p>`);
    else if (line.trim()) out.push(`<p>${line}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return out.join("");
}

/* ---------- Voz ---------- */
function say(text, rate = 0.95) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate;
  const v = speechSynthesis.getVoices().find((v) => v.lang === "en-US" && /Google|Samantha|Natural/i.test(v.name))
    || speechSynthesis.getVoices().find((v) => v.lang.startsWith("en"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-say]");
  if (b) say(b.dataset.say);
});

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("#micBtn").addEventListener("click", () => {
  if (!Rec) return alert("Seu navegador não tem reconhecimento de voz. Usa o Chrome, porra! 😅");
  if (rec) { rec.stop(); return; }
  rec = new Rec();
  rec.lang = "en-US";
  rec.interimResults = true;
  const base = $("#input").value;
  rec.onresult = (e) => {
    const t = [...e.results].map((r) => r[0].transcript).join("");
    $("#input").value = (base ? base + " " : "") + t;
  };
  rec.onend = () => {
    rec = null;
    $("#micBtn").classList.remove("rec");
    const v = $("#input").value.trim();
    if (v && v !== base.trim()) send(`🎙️ (falei no microfone) ${v}`);
  };
  rec.onerror = () => {};
  $("#micBtn").classList.add("rec");
  rec.start();
});

/* ---------- XP / streak ---------- */
function addXP(n) {
  state.xp += n;
  const today = new Date().toDateString();
  const s = state.streak;
  if (s.last !== today) {
    const y = new Date(Date.now() - 864e5).toDateString();
    s.days = s.last === y ? s.days + 1 : 1;
    s.last = today;
  }
  store.set("xp", state.xp);
  store.set("streak", s);
  renderStats();
}
function renderStats() {
  const s = state.streak;
  const alive = s.last === new Date().toDateString() || s.last === new Date(Date.now() - 864e5).toDateString();
  $("#streak").textContent = alive ? s.days : 0;
  $("#xp").textContent = state.xp;
  $("#lvlLabel").textContent = state.level;
}

/* ---------- Chat ---------- */
function bubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "me" : "ai");
  div.innerHTML = `<div class="bubble">${role === "user" ? "" : '<div class="who">Brenda 👩‍🏫</div>'}<div class="body"></div></div>`;
  const body = div.querySelector(".body");
  body.innerHTML = role === "user" ? `<p>${esc(text).replace(/\n/g, "<br>")}</p>` : md(text);
  $("#chatInner").appendChild(div);
  scrollDown();
  return body;
}
function scrollDown() { const l = $("#chatLog"); l.scrollTop = l.scrollHeight; }

function renderChat() {
  $("#chatInner").innerHTML = "";
  if (!state.history.length) {
    bubble("assistant", state.vibe === "educada"
      ? "Oi! Eu sou a **Brenda**, sua professora de inglês. 😊\n\nEscolhe uma aula na **Trilha**, um modo aqui embaixo, ou só manda um oi. Bora começar com [[Hello, how are you?]]"
      : "E aí, porra! Eu sou a **Brenda**, sua professora de inglês sem frescura. 🔥\n\nVai na **Trilha** pra seguir do zero até falar igual gringo, escolhe um modo aqui embaixo, ou só manda um [[What's up?]] e a gente começa essa merda.");
  }
  for (const m of state.history) bubble(m.role, m.content);
}

function renderQuick() {
  $("#quick").innerHTML = MODES.map(([l, p], i) => `<button class="chip" data-mode="${i}">${l}</button>`).join("");
}
$("#quick").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mode]");
  if (b) send(MODES[b.dataset.mode][1]);
});

function client() {
  return new Anthropic({ apiKey: state.apiKey, dangerouslyAllowBrowser: true });
}

function requestParams(messages, maxTokens) {
  const p = {
    model: state.model,
    max_tokens: maxTokens,
    system: systemPrompt(),
    output_config: { effort: "low" },
    messages,
  };
  // Se o filtro de segurança recusar, o servidor tenta outro modelo automaticamente.
  if (state.model !== "claude-haiku-5-5") {
    p.betas = ["server-side-fallback-2026-07-01"];
    p.fallbacks = "default";
  }
  return p;
}

function apiError(err) {
  const s = err?.status;
  if (s === 401) return "Chave da API inválida. Confere lá nas ⚙️ configurações.";
  if (s === 429) return "Muita requisição de uma vez. Espera uns segundos e tenta de novo.";
  if (s >= 500) return "A API tá instável agora. Tenta de novo daqui a pouco.";
  if (!s) return "Sem conexão com a API. Confere tua internet.";
  return `Deu ruim (${s}): ${err.message}`;
}

async function send(text, opts = {}) {
  text = text.trim();
  if (!text || busy) return;
  if (!state.apiKey) { openSettings(); return; }
  busy = true;
  $("#input").value = "";
  autoGrow();

  state.history.push({ role: "user", content: text });
  if (!opts.hidden) bubble("user", text);
  else if (opts.label) bubble("user", opts.label);
  const body = bubble("assistant", "");
  body.classList.add("typing");

  let out = "";
  try {
    const stream = client().beta.messages.stream(requestParams(state.history.slice(-30), 4000));
    stream.on("text", (delta) => {
      out += delta;
      body.innerHTML = md(out);
      scrollDown();
    });
    const final = await stream.finalMessage();
    if (final.stop_reason === "refusal") {
      out ||= "Eita, essa eu não posso responder. Bora mudar de assunto?";
    }
    body.classList.remove("typing");
    body.innerHTML = md(out);
    state.history.push({ role: "assistant", content: out });
    store.set("history", state.history.slice(-80));
    addXP(opts.xp ?? 5);
    if (opts.lessonId && /Aula concluída/i.test(out)) markDone(opts.lessonId);
    if (state.autoSpeak) {
      const phrases = [...out.matchAll(/\[\[(.+?)\]\]/g)].map((m) => m[1]);
      if (phrases.length) say(phrases.join(". "));
    }
  } catch (err) {
    body.classList.remove("typing");
    body.innerHTML = `<p style="color:var(--bad)">${esc(apiError(err))}</p>`;
    state.history.pop();
  } finally {
    busy = false;
  }
}

function autoGrow() {
  const t = $("#input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 140) + "px";
}
$("#input").addEventListener("input", autoGrow);
$("#input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("#input").value); }
});
$("#sendBtn").addEventListener("click", () => send($("#input").value));

/* ---------- Trilha ---------- */
let currentLesson = null;
function renderTrilha() {
  $("#trilha").innerHTML = CURRICULUM.map((lv) => {
    const done = lv.lessons.filter(([id]) => state.done.includes(id)).length;
    return `<div class="level">
      <h2><span class="badge">${lv.lvl}</span>${lv.name} <small>· ${done}/${lv.lessons.length}</small></h2>
      <div class="grid">${lv.lessons.map(([id, t, d]) =>
        `<button class="card ${state.done.includes(id) ? "done" : ""}" data-lesson="${id}">
          <div class="t">${t}</div><div class="d">${d}</div></button>`).join("")}
      </div></div>`;
  }).join("");
}
$("#trilha").addEventListener("click", (e) => {
  const b = e.target.closest("[data-lesson]");
  if (!b) return;
  const lv = CURRICULUM.find((l) => l.lessons.some(([id]) => id === b.dataset.lesson));
  const [id, t, d] = lv.lessons.find(([i]) => i === b.dataset.lesson);
  currentLesson = id;
  switchView("chat");
  send(`Começa a aula "${t}" (nível ${lv.lvl}: ${d}). Explica, dá exemplos e depois me passa exercícios um por um.`,
    { hidden: true, label: `📚 Aula: ${t}`, lessonId: id, xp: 10 });
});
function markDone(id) {
  if (!state.done.includes(id)) {
    state.done.push(id);
    store.set("done", state.done);
    addXP(50);
    renderTrilha();
  }
}

/* ---------- Flashcards (repetição espaçada simples) ---------- */
let deck = [], cardIdx = 0, flipped = false;
function allCards() { return [...STARTER_CARDS, ...state.myCards]; }
function buildDeck() {
  const f = $("#deckFilter").value;
  deck = allCards().filter((c) => f === "all" || (f === "mine" ? c.id.startsWith("m") : c.lvl === f));
  // Cartas com caixa baixa (mais erradas) aparecem primeiro
  deck.sort((a, b) => (state.box[a.id] ?? 0) - (state.box[b.id] ?? 0) || Math.random() - 0.5);
  cardIdx = 0;
  showCard();
}
function showCard() {
  flipped = false;
  const c = deck[cardIdx];
  $("#deckCount").textContent = deck.length ? `${cardIdx + 1}/${deck.length}` : "";
  $("#fFront").textContent = c ? c.en : "Nenhuma carta aqui ainda";
  $("#fBack").textContent = c?.pt ?? "";
  $("#fEx").textContent = c?.ex ? `“${c.ex}”` : "";
  $("#fBack").hidden = $("#fEx").hidden = true;
  $("#fHint").hidden = !c;
}
$("#flash").addEventListener("click", () => {
  if (!deck[cardIdx]) return;
  flipped = !flipped;
  $("#fBack").hidden = $("#fEx").hidden = !flipped;
  if (flipped) say(deck[cardIdx].en);
});
function grade(ok) {
  const c = deck[cardIdx];
  if (!c) return;
  state.box[c.id] = Math.max(0, Math.min(5, (state.box[c.id] ?? 0) + (ok ? 1 : -1)));
  store.set("box", state.box);
  if (ok) addXP(2);
  cardIdx = (cardIdx + 1) % deck.length;
  showCard();
}
$("#fGood").addEventListener("click", () => grade(true));
$("#fBad").addEventListener("click", () => grade(false));
$("#fSpeak").addEventListener("click", () => deck[cardIdx] && say(deck[cardIdx].en));
$("#fAsk").addEventListener("click", () => {
  const c = deck[cardIdx];
  if (!c) return;
  switchView("chat");
  send(`Me explica "${c.en}" (${c.pt}): quando usar, variações, pronúncia e me dá 3 exemplos.`);
});

function renderMyCards() {
  $("#myCards").innerHTML = state.myCards.length
    ? state.myCards.map((c) => `<div class="deck-item"><span><b>${esc(c.en)}</b> — ${esc(c.pt)}</span>
        <button class="btn" data-del="${c.id}">✕</button></div>`).join("")
    : '<p class="muted">Suas palavras salvas aparecem aqui.</p>';
}
$("#myCards").addEventListener("click", (e) => {
  const b = e.target.closest("[data-del]");
  if (!b) return;
  state.myCards = state.myCards.filter((c) => c.id !== b.dataset.del);
  store.set("myCards", state.myCards);
  renderMyCards(); buildDeck();
});
function addCard(en, pt, ex = "", lvl = state.level) {
  state.myCards.push({ id: "m" + Date.now() + Math.random().toString(36).slice(2, 6), lvl, en, pt, ex });
  store.set("myCards", state.myCards);
}
$("#addCard").addEventListener("click", () => {
  const en = $("#newEn").value.trim(), pt = $("#newPt").value.trim();
  if (!en || !pt) return;
  addCard(en, pt);
  $("#newEn").value = $("#newPt").value = "";
  renderMyCards(); buildDeck();
});
$("#genCards").addEventListener("click", async () => {
  if (!state.apiKey) return openSettings();
  const btn = $("#genCards");
  btn.disabled = true; btn.textContent = "Gerando…";
  try {
    const p = requestParams([{ role: "user", content:
      `Gere 10 palavras/frases/gírias em inglês úteis pro nível ${state.level}, diferentes destas: ${allCards().map((c) => c.en).slice(-60).join("; ")}.` }], 3000);
    p.system += "\nResponda apenas com o JSON pedido.";
    p.output_config.format = { type: "json_schema", schema: {
      type: "object", additionalProperties: false, required: ["cards"],
      properties: { cards: { type: "array", items: { type: "object", additionalProperties: false,
        required: ["en", "pt", "ex"], properties: { en: { type: "string" }, pt: { type: "string" }, ex: { type: "string" } } } } },
    } };
    const res = await client().beta.messages.create(p);
    const txt = res.content.find((b) => b.type === "text")?.text ?? "{}";
    const { cards = [] } = JSON.parse(txt);
    cards.forEach((c) => addCard(c.en, c.pt, c.ex));
    $("#deckFilter").value = "mine";
    renderMyCards(); buildDeck();
  } catch (err) {
    alert(apiError(err));
  } finally {
    btn.disabled = false; btn.textContent = "✨ IA: gerar 10 do meu nível";
  }
});
$("#deckFilter").innerHTML = `<option value="all">Todas</option><option value="mine">Minhas</option>` +
  ["A1", "A2", "B1", "B2", "C1", "C2"].map((l) => `<option value="${l}">${l}</option>`).join("");
$("#deckFilter").addEventListener("change", buildDeck);

/* ---------- Navegação ---------- */
function switchView(v) {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
  document.querySelectorAll(".view").forEach((s) => s.classList.toggle("active", s.id === "view-" + v));
  if (v === "chat") scrollDown();
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => switchView(b.dataset.view)));

/* ---------- Configurações ---------- */
function openSettings() {
  $("#apiKey").value = state.apiKey;
  $("#level").value = state.level;
  $("#vibe").value = state.vibe;
  $("#model").value = state.model;
  $("#autoSpeak").checked = state.autoSpeak;
  $("#settings").showModal();
}
$("#settingsBtn").addEventListener("click", openSettings);
$("#saveSettings").addEventListener("click", () => {
  for (const k of ["apiKey", "level", "vibe", "model"]) { state[k] = $("#" + k).value.trim(); store.set(k, state[k]); }
  state.autoSpeak = $("#autoSpeak").checked; store.set("autoSpeak", state.autoSpeak);
  $("#settings").close();
  renderStats();
  if (!state.history.length) renderChat();
});
$("#resetChat").addEventListener("click", () => {
  if (!confirm("Apagar a conversa toda?")) return;
  state.history = []; store.set("history", []);
  renderChat(); $("#settings").close();
});

/* ---------- Início ---------- */
renderStats();
renderChat();
renderQuick();
renderTrilha();
renderMyCards();
$("#deckFilter").value = state.level;
buildDeck();
if (!state.apiKey) openSettings();
</script>
</body>
</html>
