document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    // Per-page prep: substitute UUIDs, strip SRI/crossorigin (blob URLs from a
    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.
    function resourcesFor(id) {
      var map = {};
      var list = extResources[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (blobUrls[list[k].uuid]) map[list[k].id] = blobUrls[list[k].uuid];
      }
      return map;
    }
    for (const id of pageIds) {
      let t = pages[id];
      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);
      t = t.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
      // The click interceptor owns every anchor click (not a <base target>):
      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.
      var headContent = 'window.__resources = ' + JSON.stringify(resourcesFor(id)) + ';' +
        (pageIds.length > 1 ?
          'window.__bundler_pages = ' + JSON.stringify(pageIds) + ';' +
          'document.addEventListener("click", function(e){' +
            'if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;' +
            'var a = null, p = e.composedPath ? e.composedPath() : [e.target];' +
            'for (var j = 0; j < p.length && !a; j++) {' +
              'var n = p[j], tn = n && n.tagName;' +
              'if (tn === "A" || tn === "a" || tn === "AREA") a = n;' +
            '}' +
            'if (!a && e.target.closest) a = e.target.closest("a, area");' +
            'if (!a || a.hasAttribute("download")) return;' +
            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +
            'var h = a.getAttribute("href") || a.getAttribute("xlink:href");' +
            'if (!h || /^javascript:/i.test(h)) return;' +
            'if (h.charAt(0) !== "#") {' +
              'if (!tg) { var b = document.querySelector("base[target]"); if (b && b.getAttribute("target") !== "_self") return; }' +
              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.
      var headOpen = t.match(/<head[^>]*>/i);
      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).
      var template = pages[entryId];
      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ap:wrap;gap:6px;margin-top:9px;}\n.rank-sz{font-family:var(--fm);font-size:11px;font-weight:500;color:var(--t3);background:var(--bg4);border:1px solid var(--bd);border-radius:7px;padding:3px 8px;}\n.rank-sz b{color:#86EFAC;font-weight:600;margin-left:3px;}\n.rank-row{flex-direction:column;align-items:stretch;}\n.rank-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}\n\n/* check button */\n.check-btn{flex-shrink:0;width:58px;height:58px;border-radius:16px;border:2px solid var(--bd2);background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:all .16s;color:var(--t4);}\n.check-btn:active{transform:scale(.93);}\n.check-btn svg{width:28px;height:28px;}\n.lote-card.is-done .check-btn{background:var(--green);border-color:var(--green);color:#04130C;box-shadow:0 8px 22px rgba(16,185,129,.28);}\n.check-cap{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--t4);text-align:center;margin-top:6px;line-height:1.1;}\n.lote-card.is-done .check-cap{color:var(--green);}\n.check-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}\n\n/* empty */\n.empty{text-align:center;padding:70px 24px;color:var(--t4);}\n.empty-ico{font-size:42px;margin-bottom:14px;opacity:.5;}\n.empty-t{font-size:16px;font-weight:700;color:var(--t3);margin-bottom:5px;}\n.empty-d{font-size:13px;line-height:1.5;}\n\n/* FAB */\n.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:40;height:56px;padding:0 26px 0 22px;border-radius:18px;background:linear-gradient(135deg,#F2D88A,#E0BC5B);color:#0B0F18;font-size:15px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;box-shadow:0 14px 36px rgba(0,0,0,.5),0 4px 14px rgba(224,188,91,.3);transition:transform .1s;}\n.fab:active{transform:translateX(-50%) translateY(2px);}\n.fab svg{width:21px;height:21px;}\n\n/* sheet / modal */\n.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.72);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .22s;display:flex;align-items:flex-end;justify-content:center;}\n.overlay.show{opacity:1;pointer-events:auto;}\n.sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--bd);border-bottom:none;border-radius:24px 24px 0 0;max-height:92dvh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow-lg);}\n.overlay.show .sheet{transform:translateY(0);}\n.sheet-grip{width:38px;height:4px;border-radius:3px;background:var(--bd3);margin:11px auto 0;}\n.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 6px;}\n.sheet-title{font-size:19px;font-weight:800;letter-spacing:-.5px;}\n.sheet-x{width:36px;height:36px;border-radius:11px;background:var(--bg3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:18px;}\n.sheet-body{padding:8px 22px 26px;}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.field-help{font-size:11px;color:var(--t4);margin-top:6px;}\n.sheet .btn-primary{margin-top:8px;}\n\n/* toast */\n#toast-host{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:440px;pointer-events:none;}\n.toast{background:var(--bg4);border:1px solid var(--bd2);border-radius:13px;padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--t);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:toastIn .26s cubic-bezier(.32,.72,0,1);border-left:3px solid var(--accent);}\n.toast.ok{border-left-color:var(--green);}\n.toast.err{border-left-color:var(--red);}\n.toast.warn{border-left-color:var(--amber);}\n@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}\n\n/* loading */\n.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;color:var(--t4);}\n.spinner{width:34px;height:34px;border:3px solid var(--bd2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}\n@keyframes spin{to{transform:rotate(360deg)}}\n\n@media(max-width:430px){\n  .row2{grid-template-columns:1fr;}\n  .sum-v{font-size:26px;}\n}\n<\/style>\n<\/head>\n<body>\n\n<!-- ════════ LOGIN ════════ -->\n<div id=\"login-view\">\n  <div class=\"login-card\">\n    <div class=\"brand\">\n      <div class=\"brand-mark\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAYAAABccqhmAADd0ElEQVR42uz9d5hd13XfjX/26bffO71iAAwqUVnBKlZRoiSqF1uybLnFtuLIr1xiO/klVuz8kjhv4rzxGztOseMm2VaXaEqiJFLsJCrROwbT271zezl9v3/cOwOAAEmQYgHJ2c8zBAeDOfecffb6rrW+qwneAutzHZsky2t5vc7rj3NHxJv9GcSysC+v5fX2BQWxLPDLa3m9fQFBLAv98lpeb18wEMuCv7yW19sXCMSy0C+v5fX2BQOxLPjLa3m9fYFAWRb+5bW83r7ur1gW/OW1vN6+1oBYFvzltbzevkCgLAv/8lpeb1+3QFkW/uW1vN6+ICCWBX95La+3r0ugLAv/8lpeb19rQFkW/uW1vN6+IKAsC//yWl5vXxBQloV/eS2vty8IKMvC/+ZYQlneg+X16sueWBb+5bW83tzrx4kOKMvCf+Uvh4Bov4KkueXi1QwGCQlK80sosvn98nrbWALKsvBfyXZ/c5uDWIPP/u0wO36lG0+Gry4CSAFh80uGovk9IBTRBITl9ZYGAWVZ+K9oBABArZucPXyWT/7WOqwdU8hQoiivhuxL7FQVfbBCYthHdlZw4zUcGSBD2QQEaFkGy2/jrQgC2vK2XcFLNsk/I9R54IvTXHObw+f+8C7+/z+xh+hcqmm6h69MMn0R0PmueT7w8Qw9HTpGZoDQWsv46VPMnTzJ2cMhI89KKmMJIqjnIKn1mcta4K2x1GXtf6WDgEQgmB4HrWMfN95+C0FGcPj7eUy0lptw+SAgWhyCVCBnVslWa4S+TU+0iOvEWXvN9ay/eis33LWaa+4NiK8YZ6ZSpFLQUHwN0XIRUF7e575aLpEQzftfioqIZdPk/LUj2vWFnfXsv3nVAWBZ+N84N0AIiAmDU9USt2w9ytYdVzNeGGf+kIquKshX8GYUKVDmYpw5IfnRrhr5RhU7fwy/dJpkWwrUIazURjZsH2LzjUn6t8+RWVmk0pAUswq6VM/jKV5DIVQkQig0TQ5x7kuKCz5XqC2TadlXeVkgoC4L/5vEF0AwNaUiOytsWd/Htruv49TZvZRPRVFUXhEIqEKQDC263TQjJzT2LnhE9CKyNk1MmwN/Dhm9Giu5jZVrBthwdZwd7wqIrZplYcGmVjBQAhVFkUgpXtWnVdXWNaUACZ4McSMNlLSNiLqoMZcGHr4HAqVlmQiEEK89KL2FQEAsA8CbxhAACSfbJvnDPzK46tZP4NQq/MGnH6RxsBtFhTB4ZWZ1U+oE5cBldnCSe+9x2LpaYcPWbtpX3wXoIAK0+DoU6aFwisLkLr79lUl2/U0XWjl+7lo/LhCcd41S6NC5scTVtyfp356mf3WEZPswelDAdVyqToJyrsr0yXlGd+c5+ihoteiSZyDf5qf2cvIDxLLwv3lsAEVAPQiwrx3nv/yHXpJrb2J+bJb/9 =\"v\"><span id=\"f-total\">0<\/span><span class=\"u\">pçs<\/span><\/span><\/div>\n        <\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"f-valor\">Valor da peça (R$)<\/label>\n            <input class=\"input\" id=\"f-valor\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"0.01\" placeholder=\"Ex: 2,50\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"f-prazo\">Prazo<\/label>\n            <input class=\"input\" id=\"f-prazo\" type=\"date\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"f-obs\">Observação<\/label>\n          <textarea class=\"input\" id=\"f-obs\" placeholder=\"Alguma observação para a revisão…\"><\/textarea>\n        <\/div>\n        <button class=\"btn-primary\" id=\"add-btn\" type=\"submit\">Adicionar lote<\/button>\n      <\/form>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ════════ EDIT SHEET ════════ -->\n<div class=\"overlay\" id=\"edit-overlay\">\n  <div class=\"sheet\">\n    <div class=\"sheet-grip\"><\/div>\n    <div class=\"sheet-head\">\n      <div class=\"sheet-title\">Editar lote<\/div>\n      <button class=\"sheet-x\" id=\"edit-close\">✕<\/button>\n    <\/div>\n    <div class=\"sheet-body\">\n      <form id=\"edit-form\">\n        <input type=\"hidden\" id=\"e-id\">\n        <div class=\"field\">\n          <label for=\"e-prod\">Produto *<\/label>\n          <input class=\"input\" id=\"e-prod\" type=\"text\" required=\"\">\n        <\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"e-of\">Nº da OF *<\/label>\n            <input class=\"input\" id=\"e-of\" type=\"text\" inputmode=\"numeric\" required=\"\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"e-cli\">Cliente<\/label>\n            <input class=\"input\" id=\"e-cli\" type=\"text\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>Cores e quantidade por tamanho *<\/label>\n          <div class=\"colors-wrap\" id=\"e-colors\"><\/div>\n          <button type=\"button\" class=\"add-color-btn\" data-target=\"e-colors\">+ Adicionar cor<\/button>\n          <div class=\"size-total\"><span class=\"l\">Total do lote<\/span><span class=\"v\"><span id=\"e-total\">0<\/span><span class=\"u\">pçs<\/span><\/span><\/div>\n        <\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"e-valor\">Valor da peça (R$)<\/label>\n            <input class=\"input\" id=\"e-valor\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"0.01\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"e-prazo\">Prazo<\/label>\n            <input class=\"input\" id=\"e-prazo\" type=\"date\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"e-obs\">Observação<\/label>\n          <textarea class=\"input\" id=\"e-obs\"><\/textarea>\n        <\/div>\n        <button class=\"btn-primary\" id=\"edit-btn\" type=\"submit\">Salvar alterações<\/button>\n      <\/form>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ════════ COLABORADORES SHEET ════════ -->\n<div class=\"overlay\" id=\"colab-overlay\">\n  <div class=\"sheet\">\n    <div class=\"sheet-grip\"><\/div>\n    <div class=\"sheet-head\">\n      <div class=\"sheet-title\">Colaboradores<\/div>\n      <button class=\"sheet-x\" id=\"colab-close\">✕<\/button>\n    <\/div>\n    <div class=\"sheet-body\">\n      <div class=\"field-help\" style=\"margin-bottom:14px;\">Cadastre quem revisa. Ao concluir um lote, as peças entram para o colaborador selecionado.<\/div>\n      <div class=\"colab-list\" id=\"colab-list\"><\/div>\n      <form id=\"colab-form\" class=\"colab-add-row\">\n        <input class=\"input\" id=\"colab-input\" type=\"text\" placeholder=\"Nome do colaborador\" maxlength=\"40\">\n        <button class=\"colab-add-btn\" id=\"colab-add\" type=\"submit\" aria-label=\"Adicionar\">+<\/button>\n      <\/form>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ════════ CONCLUIR SHEET ════════ -->\n<div class=\"overlay\" id=\"done-overlay\">\n  <div class=\"sheet\">\n    <div class=\"sheet-grip\"><\/div>\n    <div class=\"sheet-head\">\n      <div class=\"sheet-title\">Concluir revisão<\/div>\n      <button class=\"sheet-x\" id=\"done-close\">✕<\/button>\n    <\/div>\n    <div class=\"sheet-body\">\n      <div class=\"done-lote-info\">\n        <span class=\"of-tag\" id=\"done-of\">OF —<\/span>\n        <span class=\"dp\" id=\"done-prod\">—<\/span>\n      <\/div>\n      <div class=\"field-help\" style=\"margin-bottom:12px;\">Selecione quem revisou cada tamanho. Pode ser uma pessoa diferente em cada um.<\/div>\n      <div class=\"done-quick\" id=\"done-quick\">\n        <span class=\"ql\">Aplicar a todos<\/span>\n      <\/div>\n      <div class=\"done-rows\" id=\"done-rows\"><\/div>\n      <button class=\"btn-primary\" id=\"done-confirm\">Concluir revisão<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"toast-host\"><\/div>\n\n\n\n<script type=\"module\">\nimport { initializeApp } from \"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js\";\nimport { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, browserLocalPersistence, setPersistence } from \"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js\";\nimport { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, Timestamp } from \"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js\";\n\nconst firebaseConfig={apiKey:\"AIzaSyCHcBrAnUFiIh8I0-8wIjqPJnAQc3f3rXM\",authDomain:\"jv-confecao.firebaseapp.com\",projectId:\"jv-confecao\",storageBucket:\"jv-confecao.firebasestorage.app\",messagingSenderId:\"1089479881122\",appId:\"1:1089479881122:web:10018e26e1f938d363c2fb\",measurementId:\"G-RC1SWE9Y6G\"};\nconst app=initializeApp(firebaseConfig);\nconst auth=getAuth(app);\nconst db=getFirestore(app);\n\nconst $=id=>document.getElementById(id);\nlet lotes=[];\nlet colaboradores=[];\nlet revisorAtual=\"\";\nconst esc=s=>String(s==null?\"\":s).replace(/[<>&\"]/g,c=>({\"<\":\"&lt;\",\">\":\"&gt;\",\"&\":\"&amp;\",'\"':\"&quot;\"}[c]));\nconst TAMS=[\"P\",\"M\",\"G\",\"GG\",\"XG\"];\nconst CORES_HEX={amarelo:\"#F5C518\",amarela:\"#F5C518\",azul:\"#3B82F6\",\"azul marinho\":\"#1E3A8A\",marinho:\"#1E3A8A\",vermelho:\"#EF4444\",vermelha:\"#EF4444\",verde:\"#22C55E\",preto:\"#1F2937\",preta:\"#1F2937\",branco:\"#F2D88A\",branca:\"#F2D88A\",rosa:\"#EC4899\",roxo:\"#8B5CF6\",roxa:\"#8B5CF6\",lilas:\"#A78BFA\",\"lilás\":\"#A78BFA\",laranja:\"#F97316\",cinza:\"#9CA3AF\",bege:\"#D8C3A5\",marrom:\"#92400E\",vinho:\"#7F1D1D\",caramelo:\"#B45309\",nude:\"#E2C9B0\",turquesa:\"#14B8A6\",mostarda:\"#D69E2E\",pink:\"#EC4899\",off:\"#EFEAE0\",\"off white\":\"#EFEAE0\"};\nfunction corHex(nome){\n  const k=String(nome||\"\").trim().toLowerCase();\n  if(!k) return \"#71717A\";\n  if(CORES_HEX[k]) return CORES_HEX[k];\n  for(const key in CORES_HEX){ if(k.includes(key)) return CORES_HEX[key]; }\n  let h=0; for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))%360;\n  return `hsl(${h},55%,58%)`;\n}\nfunction normTam(o){ const r={}; TAMS.forEach(t=>{const n=Number((o||{})[t]||0); if(n>0)r[t]=n;}); return r; }\nfunction tamMapTotal(m){ return TAMS.reduce((s,t)=>s+Number(m[t]||0),0); }\n// grade normalizada: [{cor, tam:{...}}] — com retrocompatibilidade p/ tamanhosQtd antigo\nfunction getGrade(l){\n  if(Array.isArray(l.gradeCores)&&l.gradeCores.length){\n    return l.gradeCores.map(g=>({cor:String(g.cor||\"\").trim(),tam:normTam(g.tam)})).filter(g=>tamMapTotal(g.tam)>0);\n  }\n  const o=l.tamanhosQtd||l.tamQtd; const tm=normTam(o);\n  if(tamMapTotal(tm)>0) return [{cor:\"\",tam:tm}];\n  return [];\n}\nfunction getTamMap(l){ // soma de tamanhos somando todas as cores\n  const agg={}; getGrade(l).forEach(g=>TAMS.forEach(t=>{if(g.tam[t])agg[t]=(agg[t]||0)+g.tam[t];}));\n  return agg;\n}\nfunction gradeTotal(l){ return getGrade(l).reduce((s,g)=>s+tamMapTotal(g.tam),0); }\n\n/* ── grade de cores no formulário ── */\nfunction colorBlockEl(cor,tam){\n  const div=document.createElement(\"div\");\n  div.className=\"color-block\";\n  div.innerHTML=`<div class=\"cb-head\">\n      <span class=\"cb-dot\" style=\"background:${corHex(cor)}\"><\/span>\n      <input class=\"cb-name\" data-role=\"cor\" placeholder=\"Cor (ex: Amarelo)\" maxlength=\"24\" value=\"${esc(cor||\"\")}\"/>\n      <span class=\"cb-sub\">0 pçs<\/span>\n      <button type=\"button\" class=\"cb-del\" aria-label=\"Remover cor\">✕<\/button>\n    <\/div>\n    <div class=\"size-grid\">${TAMS.map(t=>`<div class=\"size-cell\"><span class=\"sl\">${t}<\/span><input type=\"number\" inputmode=\"numeric\" min=\"0\" data-sz=\"${t}\" placeholder=\"0\" value=\"${tam&&tam[t]?tam[t]:\"\"}\"/><\/div>`).join(\"\")}<\/div>`;\n  return div;\n}\nfunction addColorBlock(wrapId,cor,tam,focus){\n  const wrap=$(wrapId);\n  const el=colorBlockEl(cor,tam);\n  wrap.appendChild(el);\n  atualizarBloco(el);\n  if(focus) el.querySelector(\".cb-name\").focus();\n  return el;\n}\nfunction atualizarBloco(block){\n  let sub=0;\n  block.querySelectorAll(\"input[data-sz]\").forEach(inp=>{const n=parseInt(inp.value)||0; inp.classList.toggle(\"has\",n>0); sub+=n;});\n  block.querySelector(\".cb-sub\").textContent=sub.toLocaleString(\"pt-BR\")+\" pçs\";\n  block.querySelector(\".cb-dot\").style.background=corHex(block.querySelector(\"[data-role=cor]\").value);\n}\nfunction lerGrade(wrapId){\n  const grade=[]; let total=0; const seen={};\n  $(wrapId).querySelectorAll(\".color-block\").forEach(b=>{\n    const cor=(b.querySelector(\"[data-role=cor]\").value||\"\").trim();\n    const tam={}; let sub=0;\n    b.querySelectorAll(\"input[data-sz]\").forEach(inp=>{const n=parseInt(inp.value)||0; if(n>0){tam[inp.dataset.sz]=n; sub+=n;}});\n    if(sub>0){ grade.push({cor,tam}); total+=sub; seen[cor]=(seen[cor]||0)+1; }\n  });\n  const dup=Object.keys(seen).some(k=>seen[k]>1);\n  return {grade,total,dup};\n}\nfunction preencherGrade(wrapId,grade){\n  const wrap=$(wrapId); wrap.innerHTML=\"\";\n  if(grade&&grade.length) grade.forEach(g=>addColorBlock(wrapId,g.cor,g.tam,false));\n  else addColorBlock(wrapId,\"\",null,false);\n}\nfunction bindColorsWrap(wrapId,totalId){\n  const wrap=$(wrapId);\n  wrap.addEventListener(\"input\",e=>{\n    const block=e.target.closest(\".color-block\"); if(block) atualizarBloco(block);\n    $(totalId).textContent=lerGrade(wrapId).total.toLocaleString(\"pt-BR\");\n  });\n  wrap.addEventListener(\"click\",e=>{\n    const del=e.target.closest(\".cb-del\"); if(!del) return;\n    if(wrap.querySelectorAll(\".color-block\").length<=1){ del.closest(\".color-block\").querySelectorAll(\"input\").forEach(i=>{i.value=\"\";}); atualizarBloco(del.closest(\".color-block\")); }\n    else del.closest(\".color-block\").remove();\n    $(totalId).textContent=lerGrade(wrapId).total.toLocaleString(\"pt-BR\");\n  });\n}\nlet filtro=\"pendentes\";\nlet busca=\"\";\nfunction monthKey(d=new Date()){return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\");}\nconst MES_ATUAL=monthKey();\nlet mesSel=MES_ATUAL;\n\n/* ───── helpers ───── */\nfunction ownerFields(){\n  const uid=auth.currentUser.uid;\n  return {ownerId:uid,uid,userId:uid,createdBy:uid,empresaId:\"mello-style\",perfilCriador:\"revisao\"};\n}\n\n/* ───── colaboradores ───── */\nasync function loadColaboradores(){\n  const uid=auth.currentUser?.uid; if(!uid) return;\n  try{\n    const snap=await getDocs(query(collection(db,S().colCol),where(\"ownerId\",\"==\",uid)));\n    colaboradores=snap.docs.map(d=>({id:d.id,nome:d.data().nome||\"\"})).filter(c=>c.nome).sort((a,b)=>a.nome.localeCompare(b.nome,\"pt-BR\"));\n  }catch(e){ console.error(\"COLAB_LOAD\",e); colaboradores=[]; }\n  revisorAtual=localStorage.getItem(\"revisor_\"+setorAtual+\"_\"+uid)||\"\";\n  if(revisorAtual&&!colaboradores.some(c=>c.nome===revisorAtual)) revisorAtual=\"\";\n  renderReviewerSelect();\n}\nfunction renderReviewerSelect(){\n  $(\"rv-select\").innerHTML=`<option value=\"\">Quem revisa…<\/option>`+colaboradores.map(c=>`<option value=\"${esc(c.nome)}\"${c.nome===revisorAtual?\" selected\":\"\"}>${esc(c.nome)}<\/option>`).join(\"\");\n}\nfunction setRevisor(nome){\n  revisorAtual=nome||\"\";\n  const uid=auth.currentUser?.uid;\n  if(uid){ const k=\"revisor_\"+setorAtual+\"_\"+uid; if(revisorAtual) localStorage.setItem(k,revisorAtual); else localStorage.removeItem(k); }\n}\nfunction renderColabList(){\n  const host=$(\"colab-list\");\n  if(!colaboradores.length){ host.innerHTML=`<div class=\"colab-empty\">Nenhum colaborador cadastrado ainda.<\/div>`; return; }\n  host.innerHTML=colaboradores.map(c=>`<div class=\"colab-item\"><span>${esc(c.nome)}<\/span><button data-del=\"${c.id}\" aria-label=\"Remover\">✕<\/button><\/div>`).join(\"\");\n  host.querySelectorAll(\"[data-del]\").forEach(b=>b.addEventListener(\"click\",()=>removeColaborador(b.dataset.del)));\n}\nasync function addColaborador(nome){\n  nome=(nome||\"\").trim(); if(!nome) return;\n  if(colaboradores.some(c=>c.nome.toLowerCase()===nome.toLowerCase())){ toast(\"Esse colaborador já existe\",\"warn\"); return; }\n  try{\n    const ref=await addDoc(collection(db,S().colCol),{...ownerFields(),nome,criadoEm:Timestamp.now()});\n    colaboradores.push({id:ref.id,nome}); colaboradores.sort((a,b)=>a.nome.localeCompare(b.nome,\"pt-BR\"));\n    renderReviewerSelect(); renderColabList(); toast(\"Colaborador adicionado ✓\",\"ok\");\n  }catch(e){ console.error(\"COLAB_ADD\",e); toast(\"Erro ao adicionar colaborador\",\"err\"); }\n}\nasync function removeColaborador(id){\n  const c=colaboradores.find(x=>x.id===id); if(!c) return;\n  if(!confirm(`Remover \"${c.nome}\"? Os lotes já revisados por ${c.nome} continuam contando.`)) return;\n  try{\n    await deleteDoc(doc(db,S().colCol,id));\n    colaboradores=colaboradores.filter(x=>x.id!==id);\n    if(revisorAtual===c.nome) setRevisor(\"\");\n    renderReviewerSelect(); renderColabList();\n  }catch(e){ console.error(\"COLAB_DEL\",e); toast(\"Erro ao remover\",\"err\"); }\n}\nfunction renderPorColaborador(concluidos){\n  const map=new Map();\n  function bump(nome,size,cor,qty){\n    const cur=map.get(nome)||{nome,pecas:0,sizes:{},cores:{},loteIds:new Set()};\n    cur.pecas+=qty;\n    if(size) cur.sizes[size]=(cur.sizes[size]||0)+qty;\n    if(cor) cur.cores[cor]=(cur.cores[cor]||0)+qty;\n    map.set(nome,cur); return cur;\n  }\n  concluidos.forEach(l=>{\n    const grade=getGrade(l);\n    const revCor=l[S().fCor]||null;\n    const revTam=l[S().fTam]||null;\n    if(grade.length){\n      grade.forEach(g=>{\n        const ck=g.cor||\"_geral\";\n        TAMS.forEach(t=>{\n          if(g.tam[t]>0){\n            let nome=(revCor&&revCor[ck]&&revCor[ck][t]) || (revTam&&revTam[t]) || l[S().fNome];\n            nome=(nome||\"\").trim()||\"Sem colaborador\";\n            bump(nome,t,g.cor||null,g.tam[t]).loteIds.add(l.id);\n          }\n        });\n      });\n    }else{\n      const nome=(l[S().fNome]||\"\").trim()||\"Sem colaborador\";\n      bump(nome,null,null,Number(l.qtdTotal||0)).loteIds.add(l.id);\n    }\n  });\n  const rows=[...map.values()].map(r=>({...r,lotes:r.loteIds.size})).sort((a,b)=>b.pecas-a.pecas);\n  const sub=$(\"rank-sub\"), body=$(\"rank-body\");\n  if(!rows.length){ sub.textContent=\"Nenhuma peça concluída\"; body.innerHTML=`<div class=\"rank-empty\">Marque lotes como concluídos para ver as peças por colaborador.<\/div>`; return; }\n  sub.textContent=rows.length===1?\"1 colaborador\":rows.length+\" colaboradores\";\n  body.innerHTML=rows.map(r=>{\n    const szs=TAMS.filter(t=>r.sizes[t]>0).map(t=>`<span class=\"rank-sz\">${t}<b>${r.sizes[t].toLocaleString(\"pt-BR\")}<\/b><\/span>`).join(\"\");\n    const cores=Object.keys(r.cores).sort((a,b)=>r.cores[b]-r.cores[a]).map(c=>`<span class=\"rank-sz\"><span class=\"cd\" style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:${corHex(c)};margin-right:4px;vertical-align:middle;\"><\/span>${esc(c)}<b>${r.cores[c].toLocaleString(\"pt-BR\")}<\/b><\/span>`).join(\"\");\n    return `<div class=\"rank-row\">\n      <div class=\"rank-top\">\n        <div class=\"rank-name\"><span class=\"rank-dot\"><\/span>${esc(r.nome)}<\/div>\n        <div class=\"rank-nums\"><strong>${r.pecas.toLocaleString(\"pt-BR\")}<span class=\"u\">pçs<\/span><\/strong><span>${r.lotes} ${r.lotes===1?\"lote\":\"lotes\"}<\/span><\/div>\n      <\/div>\n      ${cores?`<div class=\"rank-sizes\">${cores}<\/div>`:\"\"}\n      ${szs?`<div class=\"rank-sizes\">${szs}<\/div>`:\"\"}\n    <\/div>`;\n  }).join(\"\");\n}\nconst SETORES={\n  revisao:{key:\"revisao\",nome:\"Revisão\",titulo:\"Lotes da Revisão\",verbo:\"Revisado\",colCol:\"colaboradoresRevisao\",fNome:\"revisadoPorNome\",fCor:\"revisoesPorCor\",fTam:\"revisoesPorTam\",fEm:\"revisadoEm\",\n    concl:l=>l.status===\"Concluído\",\n    aplicar:(o,nome,porCor)=>{o.status=\"Concluído\";o.revisadoPorNome=nome;o.revisoesPorCor=porCor;o.revisoesPorTam=null;o.concluidoEm=Timestamp.now();o.revisadoEm=Timestamp.now();},\n    reabrir:o=>{o.status=\"Em andamento\";o.revisadoPorNome=null;o.revisoesPorCor={};o.revisoesPorTam=null;o.revisadoEm=null;}},\n  arremate:{key:\"arremate\",nome:\"Arremate lateral\",titulo:\"Lotes do Arremate lateral\",verbo:\"Arrematado\",colCol:\"colaboradoresArremateLateral\",fNome:\"arremateLateralPorNome\",fCor:\"arremateLateralPorCor\",fTam:\"arremateLateralPorTam\",fEm:\"arremateLateralEm\",\n    concl:l=>!!l.arremateLateralConcluido,\n    aplicar:(o,nome,porCor)=>{o.arremateLateralConcluido=true;o.arremateLateralPorNome=nome;o.arremateLateralPorCor=porCor;o.arremateLateralEm=Timestamp.now();},\n    reabrir:o=>{o.arremateLateralConcluido=false;o.arremateLateralPorNome=null;o.arremateLateralPorCor={};o.arremateLateralEm=null;}},\n  manga:{key:\"manga\",nome:\"Manga\",titulo:\"Lotes da Manga\",verbo:\"Pronto\",colCol:\"colaboradoresManga\",fNome:\"mangaPorNome\",fCor:\"mangaPorCor\",fTam:\"mangaPorTam\",fEm:\"mangaEm\",\n    concl:l=>!!l.mangaConcluido,\n    aplicar:(o,nome,porCor)=>{o.mangaConcluido=true;o.mangaPorNome=nome;o.mangaPorCor=porCor;o.mangaEm=Timestamp.now();},\n    reabrir:o=>{o.mangaConcluido=false;o.mangaPorNome=null;o.mangaPorCor={};o.mangaEm=null;}}\n};\nlet setorAtual=localStorage.getItem(\"jv_setor_atual\")||\"revisao\";\nif(!SETORES[setorAtual])setorAtual=\"revisao\";\nfunction S(){return SETORES[setorAtual];}\nfunction isConcluido(l){ return S().concl(l); }\nfunction isCancelado(l){ return l.status===\"Cancelado\"; }\nfunction tsMonth(ts){ const s=ts?.seconds; if(!s) return \"\"; return monthKey(new Date(s*1000)); }\nfunction loteCompetencia(l){ return String(l.competenciaFaturamento||l.competencia||l.mesCompetencia||l.mesCaixa||\"\").trim(); }\nfunction lotePertenceAoMes(l,mes){\n  const comp=loteCompetencia(l);\n  if(comp) return comp===mes;\n  const criado=tsMonth(l.criadoEm||l.createdAt);\n  const concl=isConcluido(l)?tsMonth(l.concluidoEm||l.updatedAt||l.updatedEm||l.criadoEm||l.createdAt):\"\";\n  return criado===mes||concl===mes;\n}\nfunction mesLabel(mes){\n  const [y,m]=mes.split(\"-\").map(Number);\n  return new Date(y,m-1,1).toLocaleDateString(\"pt-BR\",{month:\"long\",year:\"numeric\"});\n}\nfunction syncMonthUI(){\n  $(\"mn-text\").textContent=mesLabel(mesSel);\n  $(\"mn-input\").value=mesSel;\n  $(\"mn-today\").classList.toggle(\"show\",mesSel!==MES_ATUAL);\n}\nfunction shiftMes(delta){\n  const [y,m]=mesSel.split(\"-\").map(Number);\n  mesSel=monthKey(new Date(y,m-1+delta,1));\n  syncMonthUI(); render();\n}\n\nfunction toast(msg,type=\"\"){\n  const host=$(\"toast-host\");\n  const el=document.createElement(\"div\");\n  el.className=\"toast \"+type;\n  const ico=type===\"ok\"?\"✓\":type===\"err\"?\"⚠\":type===\"warn\"?\"!\":\"•\";\n  el.innerHTML=`<span>${ico}<\/span><span>${msg}<\/span>`;\n  host.appendChild(el);\n  setTimeout(()=>{el.style.transition=\"opacity .3s\";el.style.opacity=\"0\";setTimeout(()=>el.remove(),300);},3000);\n}\nfunction loginError(msg){\n  const e=$(\"login-err\");\n  if(!msg){e.classList.remove(\"show\");return;}\n  e.textContent=msg;e.classList.add(\"show\");\n}\nfunction authMsg(code){\n  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(code)) return \"E-mail ou senha incorretos.\";\n  if(/invalid-email/.test(code)) return \"E-mail inválido.\";\n  if(/too-many-requests/.test(code)) return \"Muitas tentativas. Aguarde um momento e tente de novo.\";\n  if(/network-request-failed/.test(code)) return \"Falha de conexão. Verifique a internet.\";\n  return \"Não foi possível entrar. Tente novamente.\";\n}\n\nfunction prazoTag(prazo,concluido){\n  if(!prazo) return \"\";\n  const hoje=new Date();hoje.setHours(0,0,0,0);\n  const d=new Date(prazo+\"T00:00:00\");\n  const dias=Math.round((d-hoje)/864e5);\n  const txt=d.toLocaleDateString(\"pt-BR\",{day:\"2-digit\",month:\"2-digit\"});\n  let cls=\"prazo-ok\",label=\"Prazo \"+txt;\n  if(concluido){cls=\"\";label=\"Prazo \"+txt;}\n  else if(dias<0){cls=\"prazo-late\";label=\"Atrasado \"+txt;}\n  else if(dias===0){cls=\"prazo-soon\";label=\"Vence hoje\";}\n  else if(dias<=3){cls=\"prazo-soon\";label=`${dias}d · ${txt}`;}\n  return `<span class=\"mtag ${cls}\"><span class=\"mi\">⏱<\/span>${label}<\/span>`;\n}\n\n/* ───── data ───── */\nasync function carregar(){\n  const uid=auth.currentUser?.uid;\n  if(!uid) return;\n  try{\n    const snap=await getDocs(query(collection(db,\"lotes\"),where(\"ownerId\",\"==\",uid)));\n    lotes=snap.docs.map(d=>({id:d.id,...d.data()})).filter(l=>!isCancelado(l));\n    render();\n  }catch(e){\n    console.error(\"LOAD_ERROR\",e);\n    $(\"list-host\").innerHTML=`<div class=\"empty\"><div class=\"empty-ico\">⚠<\/div><div class=\"empty-t\">Não foi possível carregar<\/div><div class=\"empty-d\">${e?.code?.includes(\"permission\")?\"Sem permissão para este login.\":\"Verifique a conexão e tente novamente.\"}<\/div><\/div>`;\n    toast(\"Erro ao carregar lotes\",\"err\");\n  }\n}\n\nfunction ordenar(arr){\n  return arr.slice().sort((a,b)=>{\n    const ca=isConcluido(a),cb=isConcluido(b);\n    if(ca!==cb) return ca?1:-1;               // pendentes primeiro\n    const pa=a.prazo||\"9999-99-99\",pb=b.prazo||\"9999-99-99\";\n    if(pa!==pb) return pa<pb?-1:1;            // prazo mais próximo primeiro\n    const ta=a.criadoEm?.seconds||a.createdAt?.seconds||0;\n    const tb=b.criadoEm?.seconds||b.createdAt?.seconds||0;\n    return tb-ta;                            // mais novos primeiro\n  });\n}\n\nfunction render(){\n  const mesLotes=lotes.filter(l=>lotePertenceAoMes(l,mesSel));\n  const concluidosMes=mesLotes.filter(isConcluido);\n  const pend=mesLotes.filter(l=>!isConcluido(l)).length;\n  const done=concluidosMes.length;\n  const pecas=concluidosMes.reduce((s,l)=>s+Number(l.qtdTotal||0),0);\n  $(\"sum-pend\").textContent=pend;\n  $(\"sum-done\").textContent=done;\n  $(\"sum-pecas\").textContent=pecas.toLocaleString(\"pt-BR\");\n  $(\"c-pend\").textContent=pend;\n  $(\"c-done\").textContent=done;\n  $(\"c-all\").textContent=mesLotes.length;\n  renderPorColaborador(concluidosMes);\n\n  let lista=mesLotes;\n  if(filtro===\"pendentes\") lista=lista.filter(l=>!isConcluido(l));\n  else if(filtro===\"concluidos\") lista=lista.filter(l=>isConcluido(l));\n  if(busca){\n    const q=busca.toLowerCase();\n    lista=lista.filter(l=>[l.numeroOf,l.produto,l.cliente,l.tamanhos,l.observacoes].map(x=>String(x||\"\").toLowerCase()).join(\" \").includes(q));\n  }\n  lista=ordenar(lista);\n\n  const host=$(\"list-host\");\n  if(!lista.length){\n    const ehMes=mesSel===MES_ATUAL?\"deste mês\":`de ${mesLabel(mesSel)}`;\n    const msg=busca?[\"🔍\",\"Nada encontrado\",\"Tente outro termo de busca.\"]\n      :filtro===\"concluidos\"?[\"📦\",\"Nenhum concluído\",`Sem lotes concluídos ${ehMes}.`]\n      :filtro===\"pendentes\"?[\"✓\",\"Tudo concluído!\",`Não há lotes pendentes ${ehMes}.`]\n      :[\"📋\",\"Nenhum lote\ ||(l.tamanhos?`<span class=\"mtag\"><span class=\"mi\">📐<\/span>${esc(l.tamanhos)}<\/span>`:\"\")}\n          ${prazoTag(l.prazo,done)}\n        <\/div>\n        ${l.observacoes?`<div class=\"lc-obs\">💬 ${esc(l.observacoes)}<\/div>`:\"\"}\n      <\/div>\n      <div class=\"check-col\">\n        <button class=\"check-btn\" data-id=\"${l.id}\" data-done=\"${done?1:0}\" aria-label=\"${done?\"Reabrir\":\"Marcar concluído\"}\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7\"/><\/svg>\n        <\/button>\n        <div class=\"check-cap\">${done?\"Concluído\":\"Marcar\"}<\/div>\n      <\/div>\n    <\/div>`;\n  }).join(\"\")+`<\/div>`;\n\n  host.querySelectorAll(\".check-btn\").forEach(b=>b.addEventListener(\"click\",()=>{\n    if(b.dataset.done===\"1\") reabrirLote(b.dataset.id);\n    else abrirConcluir(b.dataset.id);\n  }));\n  host.querySelectorAll(\".lc-edit\").forEach(b=>b.addEventListener(\"click\",()=>abrirEdit(b.dataset.edit)));\n}\n\nlet loteConcluindo=null;\nfunction abrirConcluir(id){\n  const l=lotes.find(x=>x.id===id);\n  if(!l) return;\n  if(!colaboradores.length){\n    toast(\"Cadastre colaboradores em “Gerir” primeiro\",\"warn\");\n    renderColabList(); $(\"colab-overlay\").classList.add(\"show\"); setTimeout(()=>$(\"colab-input\").focus(),300);\n    return;\n  }\n  loteConcluindo=l;\n  $(\"done-of\").textContent=\"OF \"+(l.numeroOf||\"—\");\n  $(\"done-prod\").textContent=l.produto||\"—\";\n  const grade=getGrade(l);\n  const prev=l[S().fCor]||{};\n  const opts=`<option value=\"\">— quem revisou —<\/option>`+colaboradores.map(c=>`<option value=\"${esc(c.nome)}\">${esc(c.nome)}<\/option>`).join(\"\");\n  let html;\n  if(grade.length){\n    html=grade.map((g,gi)=>{\n      const ck=g.cor||\"_geral\";\n      const rows=TAMS.filter(t=>g.tam[t]>0).map(t=>\n        `<div class=\"done-row\"><span class=\"done-sz\">${t}<\/span><span class=\"done-qty\">${g.tam[t]} pçs<\/span><select class=\"rv-select done-rv\" data-cor=\"${esc(ck)}\" data-sz=\"${t}\">${opts}<\/select><\/div>`\n      ).join(\"\");\n      return `<div class=\"done-color\">\n        <div class=\"done-color-head\">\n          <span class=\"dc-dot\" style=\"background:${corHex(g.cor)}\"><\/span>\n          <span class=\"dc-name\">${g.cor?esc(g.cor):\"Sem cor\"}<\/span>\n          <span class=\"dc-qty\">${tamMapTotal(g.tam)} pçs<\/span>\n          <select class=\"rv-select dc-apply\"><option value=\"\">↓ toda a cor<\/option>${colaboradores.map(c=>`<option value=\"${esc(c.nome)}\">${esc(c.nome)}<\/option>`).join(\"\")}<\/select>\n        <\/div>\n        <div class=\"done-rows-inner\">${rows}<\/div>\n      <\/div>`;\n    }).join(\"\");\n  }else{\n    html=`<div class=\"done-color\"><div class=\"done-rows-inner\"><div class=\"done-row\"><span class=\"done-sz\">TOTAL<\/span><span class=\"done-qty\">${Number(l.qtdTotal||0)} pçs<\/span><select class=\"rv-select done-rv\" data-cor=\"_geral\" data-sz=\"_total\">${opts}<\/select><\/div><\/div><\/div>`;\n  }\n  $(\"done-rows\").innerHTML=html;\n  const qh=$(\"done-quick\");\n  qh.innerHTML=`<span class=\"ql\">Aplicar a todos<\/span>`+colaboradores.map(c=>`<button type=\"button\" data-all=\"${esc(c.nome)}\">${esc(c.nome)}<\/button>`).join(\"\");\n  qh.querySelectorAll(\"[data-all]\").forEach(b=>b.addEventListener(\"click\",()=>aplicarTodos(b.dataset.all)));\n  $(\"done-rows\").querySelectorAll(\"select.dc-apply\").forEach(s=>s.addEventListener(\"change\",()=>{\n    const v=s.value, block=s.closest(\".done-color\");\n    block.querySelectorAll(\"select.done-rv\").forEach(rv=>{ if([...rv.options].some(o=>o.value===v)) rv.value=v; });\n    s.value=\"\";\n  }));\n  $(\"done-rows\").querySelectorAll(\"select.done-rv\").forEach(s=>{\n    const ck=s.dataset.cor, t=s.dataset.sz;\n    let v=t===\"_total\"?(l[S().fNome]||revisorAtual||\"\"):((prev[ck]&&prev[ck][t])||revisorAtual||\"\");\n    if([...s.options].some(o=>o.value===v)) s.value=v;\n  });\n  $(\"done-overlay\").classList.add(\"show\");\n}\nfunction fecharConcluir(){ $(\"done-overlay\").classList.remove(\"show\"); loteConcluindo=null; }\nfunction aplicarTodos(nome){\n  $(\"done-rows\").querySelectorAll(\"select.done-rv\").forEach(s=>{ if([...s.options].some(o=>o.value===nome)) s.value=nome; });\n}\n\nasync function confirmarConcluir(){\n  const l=loteConcluindo;\n  if(!l) return;\n  const selects=[...$(\"done-rows\").querySelectorAll(\"select.done-rv\")];\n  const revisoesPorCor={};\n  let any=false;\n  selects.forEach(s=>{ if(s.value){ const ck=s.dataset.cor||\"_geral\"; (revisoesPorCor[ck]=revisoesPorCor[ck]||{})[s.dataset.sz]=s.value; any=true; } });\n  if(!any){ toast(\"Selecione quem revisou\",\"warn\"); return; }\n  const revisadoPorNome=[...new Set(selects.filter(s=>s.value).map(s=>s.value))].join(\", \");\n\n  // otimista\n  S().aplicar(l,revisadoPorNome,revisoesPorCor);\n  fecharConcluir(); render();\n  try{\n    const orig=l.criadoEm||l.createdAt;\n    const payload={...ownerFields(),updatedAt:Timestamp.now(),updatedEm:Timestamp.now()};\n    S().aplicar(payload,revisadoPorNome,revisoesPorCor);\n    if(orig){payload.criadoEm=orig;payload.createdAt=orig;}\n    await updateDoc(doc(db,\"lotes\",l.id),payload);\n    toast(S().nome+\" concluída ✓\",\"ok\");\n  }catch(e){\n    console.error(\"UPDATE_ERROR\",e);\n    await carregar();\n    toast(\"Não foi possível salvar. Tente de novo.\",\"err\");\n  }\n}\n\nasync function reabrirLote(id){\n  const l=lotes.find(x=>x.id===id);\n  if(!l) return;\n  if(!confirm(\"Reabrir este lote? A revisão por cor/tamanho será desfeita.\")) return;\n  S().reabrir(l);\n  render();\n  try{\n    const orig=l.criadoEm||l.createdAt;\n    const payload={...ownerFields(),updatedAt:Timestamp.now(),updatedEm:Timestamp.now()};\n    S().reabrir(payload);\n    if(orig){payload.criadoEm=orig;payload.createdAt=orig;}\n    await updateDoc(doc(db,\"lotes\",id),payload);\n    toast(\"Lote reaberto\",\"warn\");\n  }catch(e){\n    console.error(\"UPDATE_ERROR\",e);\n    await carregar();\n    toast(\"Não foi possível salvar. Tente de novo.\",\"err\");\n  }\n}\n\n/* ───── add ───── */\nfunction abrirAdd(){ preencherGrade(\"f-colors\",null); $(\"f-total\").textContent=\"0\"; $(\"add-overlay\").classList.add(\"show\"); setTimeout(()=>$(\"f-prod\").focus(),300); }\nfunction fecharAdd(){ $(\"add-overlay\").classList.remove(\"show\"); }\n\nasync function salvarLote(e){\n  e.preventDefault();\n  const numeroOf=$(\"f-of\").value.trim();\n  const produto=$(\"f-prod\").value.trim();\n  const {grade:gradeCores,total:qtdTotal,dup}=lerGrade(\"f-colors\");\n  if(dup){ toast(\"Há cores repetidas — junte-as numa só\",\"err\"); return; }\n  const tamanhosQtd={}; TAMS.forEach(t=>{const s=gradeCores.reduce((a,g)=>a+(g.tam[t]||0),0); if(s>0)tamanhosQtd[t]=s;});\n  const tamanhos=TAMS.filter(t=>tamanhosQtd[t]>0).join(\", \");\n  const cliente=$(\"f-cli\").value.trim();\n  const valorPeca=parseFloat(String($(\"f-valor\").value).replace(\",\",\".\"))||0;\n  const prazo=$(\"f-prazo\").value;\n  const observacoes=$(\"f-obs\").value.trim();\n  if(!numeroOf||!produto||!qtdTotal){ toast(\"Preencha OF, produto e ao menos uma cor com quantidade\",\"err\"); return; }\n\n  const btn=$(\"add-btn\");\n  btn.disabled=true; btn.textContent=\"Salvando…\";\n  try{\n    const now=Timestamp.now();\n    await addDoc(collection(db,\"lotes\"),{\n      ...ownerFields(),\n      numeroOf,produto,qtdTotal,tamanhosQtd,gradeCores,cliente,tamanhos,\n      prazo:prazo||null,observacoes,\n      valorPeca,status:\"Aberto\",prioridade:\"Normal\",\n      competenciaFaturamento:new Date().toISOString().slice(0,7),\n      criadoEm:now,createdAt:now,updatedAt:now,updatedEm:now\n    });\n    $(\"add-form\").reset();\n    fecharAdd();\n    toast(\"Lote adicionado ✓\",\"ok\");\n    await carregar();\n  }catch(err){\n    console.error(\"ADD_ERROR\",err);\n    toast(\"Erro ao adicionar lote\",\"err\");\n  }finally{\n    btn.disabled=false; btn.textContent=\"Adicionar lote\";\n  }\n}\n\n/* ───── edit ───── */\nfunction abrirEdit(id){\n  const l=lotes.find(x=>x.id===id);\n  if(!l) return;\n  $(\"e-id\").value=l.id;\n  $(\"e-of\").value=l.numeroOf||\"\";\n  $(\"e-prod\").value=l.produto||\"\";\n  preencherGrade(\"e-colors\",getGrade(l));\n  $(\"e-total\").textContent=(gradeTotal(l)||Number(l.qtdTotal||0)).toLocaleString(\"pt-BR\");\n  $(\"e-cli\").value=l.cliente||\"\";\n  $(\"e-valor\").value=l.valorPeca||\"\";\n  $(\"e-prazo\").value=l.prazo||\"\";\n  $(\"e-obs\").value=l.observacoes||\"\";\n  $(\"edit-overlay\").classList.add(\"show\");\n}\nfunction fecharEdit(){ $(\"edit-overlay\").classList.remove(\"show\"); }\n\nasync function salvarEdicao(e){\n  e.preventDefault();\n  const id=$(\"e-id\").value;\n  const l=lotes.find(x=>x.id===id);\n  if(!l) return;\n  const numeroOf=$(\"e-of\").value.trim();\n  const produto=$(\"e-prod\").value.trim();\n  const {grade:gradeCores,total:qtdTotal,dup}=lerGrade(\"e-colors\");\n  if(dup){ toast(\"Há cores repetidas — junte-as numa só\",\"err\"); return; }\n  const tamanhosQtd={}; TAMS.forEach(t=>{const s=gradeCores.reduce((a,g)=>a+(g.tam[t]||0),0); if(s>0)tamanhosQtd[t]=s;});\n  const tamanhos=TAMS.filter(t=>tamanhosQtd[t]>0).join(\", \");\n  const cliente=$(\"e-cli\").value.trim();\n  const valorPeca=parseFloat(String($(\"e-valor\").value).replace(\",\",\".\"))||0;\n  const prazo=$(\"e-prazo\").value;\n  const observacoes=$(\"e-obs\").value.trim();\n  if(!numeroOf||!produto||!qtdTotal){ toast(\"Preencha OF, produto e ao menos uma cor com quantidade\",\"err\"); return; }\n\n  const btn=$(\"edit-btn\");\n  btn.disabled=true; btn.textContent=\"Salvando…\";\n  try{\n    const orig=l.criadoEm||l.createdAt;\n    const payload={...ownerFields(),numeroOf,produto,qtdTotal,tamanhosQtd,gradeCores,cliente,valorPeca,tamanhos,prazo:prazo||null,observacoes,status:l.status||\"Aberto\",updatedAt:Timestamp.now(),updatedEm:Timestamp.now()};\n    if(orig){payload.criadoEm=orig;payload.createdAt=orig;}\n    await updateDoc(doc(db,\"lotes\",id),payload);\n    Object.assign(l,{numeroOf,produto,qtdTotal,tamanhosQtd,gradeCores,cliente,valorPeca,tamanhos,prazo:prazo||null,observacoes});\n    fecharEdit();\n    toast(\"Lote atualizado ✓\",\"ok\");\n    render();\n  }catch(err){\n    console.error(\"EDIT_ERROR\",err);\n    toast(\"Erro ao salvar alterações\",\"err\");\n  }finally{\n    btn.disabled=false; btn.textContent=\"Salvar alterações\";\n  }\n}\n\n/* ───── setor ───── */\nfunction aplicarSetorUI(){\n  document.querySelectorAll(\".setor-btn\").forEach(b=>b.classList.toggle(\"active\",b.dataset.setor===setorAtual));\n  const t=$(\"tb-t1\"); if(t) t.textContent=S().titulo;\n}\nfunction trocarSetor(key){\n  if(!SETORES[key]||key===setorAtual) return;\n  setorAtual=key; localStorage.setItem(\"jv_setor_atual\",key);\n  aplicarSetorUI();\n  loadColaboradores().then(()=>render());\n}\ndocument.querySelectorAll(\".setor-btn\").forEach(b=>b.addEventListener(\"click\",()=>trocarSetor(b.dataset.setor)));\naplicarSetorUI();\n\n/* ───── metas ───── */\nlet metas={revisao:{hora:0,dia:0},arremate:{hora:0,dia:0},manga:{hora:0,dia:0}};\nlet metasDocId=null;\nconst ORDEM_SETORES=[\"revisao\",\"arremate\",\"manga\"];\nasync function loadMetas(){\n  const uid=auth.currentUser&&auth.currentUser.uid; if(!uid) return;\n  try{\n    const snap=await getDocs(query(collection(db,\"metasSetores\"),where(\"ownerId\",\"==\",uid)));\n    if(snap.docs.length){\n      const d=snap.docs[0]; metasDocId=d.id; const m=(d.data()||{}).metas||{};\n      ORDEM_SETORES.forEach(k=>{ metas[k]={hora:Number((m[k]||{}).hora||0),dia:Number((m[k]||{}).dia||0)}; });\n    } else { metasDocId=null; }\n  }catch(err){ console.error(\"METAS_LOAD\",err); }\n  if($(\"view-metas\")&&$(\"view-metas\").style.display!==\"none\") renderMetas();\n}\nasync function salvarMetas(){\n  const uid=auth.currentUser&&auth.currentUser.uid; if(!uid) return;\n  try{\n    if(metasDocId){ await updateDoc(doc(db,\"metasSetores\",metasDocId),{...ownerFields(),metas,updatedEm:Timestamp.now()}); }\n    else { const ref=await addDoc(collection(db,\"metasSetores\"),{...ownerFields(),metas,criadoEm:Timestamp.now()}); metasDocId=ref.id; }\n  }catch(err){ console.error(\"METAS_SAVE\",err); toast(\"Não foi possível salvar a meta\",\"err\"); }\n}\nfunction _hojeStr(){ const d=new Date(); return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\"); }\nfunction _emStr(em){ const se=em&&em.seconds; if(!se) return \"\"; const d=new Date(se*1000); return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\"); }\nfunction feitoHojeSetor(k){\n  const cfg=SETORES[k], hoje=_hojeStr(); let tot=0;\n  (Array.isArray(lotes)?lotes:[]).forEach(l=>{ if(!cfg.concl(l)) return; if(_emStr(l[cfg.fEm])!==hoje) return; tot+=gradeTotal(l)||Number(l.qtdTotal||0); });\n  return tot;\n}\nfunction renderMetas(){\n  const host=$(\"view-metas\"); if(!host) return;\n  let metaDiaTot=0, metaHoraTot=0, feitoTot=0;\n  const cards=ORDEM_SETORES.map(k=>{\n    const cfg=SETORES[k], m=metas[k]||{hora:0,dia:0}, feito=feitoHojeSetor(k);\n    metaDiaTot+=Number(m.dia||0); metaHoraTot+=Number(m.hora||0); feitoTot+=feito;\n    const pctReal=m.dia>0?Math.round(feito/m.dia*100):0;\n    const pctBar=Math.min(100,pctReal);\n    const batida=m.dia>0&&feito>=m.dia, falta=Math.max(0,Number(m.dia||0)-feito), sobra=Math.max(0,feito-Number(m.dia||0));\n    return `<div class=\"meta-card\">\n      <div class=\"meta-head\"><span class=\"meta-nome\">${cfg.nome}<\/span>${m.dia>0?'<span class=\"meta-badge'+(batida?' ok':'')+'\">'+pctReal+'%<\/span>':''}<\/div>\n      <div class=\"meta-inputs\">\n        <label>Meta / hora<input type=\"number\" min=\"0\" inputmode=\"numeric\" data-meta=\"${k}\" data-campo=\"hora\" value=\"${m.hora||''}\" placeholder=\"0\"><\/label>\n        <label>Meta / dia<input type=\"number\" min=\"0\" inputmode=\"numeric\" data-meta=\"${k}\" data-campo=\"dia\" value=\"${m.dia||''}\" placeholder=\"0\"><\/label>\n      <\/div>\n      <div class=\"meta-bar\"><div class=\"meta-fill${batida?' ok':''}\" style=\"width:${pctBar}%\"><\/div><\/div>\n      <div class=\"meta-sub\">Feito hoje: <b>${feito.toLocaleString('pt-BR')}<\/b>${m.dia>0?' / '+Number(m.dia).toLocaleString('pt-BR')+' pçs · '+(batida?('meta batida 🎉'+(sobra>0?' +'+(pctReal-100)+'% ('+sobra.toLocaleString('pt-BR')+' acima)':'')):'faltam '+falta.toLocaleString('pt-BR')):' pçs'}<\/div>\n    <\/div>`;\n  }).join(\"\");\n  const pctTotReal=metaDiaTot>0?Math.round(feitoTot/metaDiaTot*100):0, pctTot=Math.min(100,pctTotReal), totBat=metaDiaTot>0&&feitoTot>=metaDiaTot, sobraTot=Math.max(0,feitoTot-metaDiaTot);\n  const total=`<div class=\"meta-total-card\">\n    <div class=\"mt-l\">Meta do dia inteiro<\/div>\n    <div class=\"mt-v\">${feitoTot.toLocaleString('pt-BR')} <span>/ ${metaDiaTot.toLocaleString('pt-BR')} pçs<\/span><\/div>\n    <div class=\"meta-bar big\"><div class=\"meta-fill${totBat?' ok':''}\" style=\"width:${pctTot}%\"><\/div><\/div>\n    <div class=\"mt-sub\">${metaDiaTot>0?(totBat?('Meta do dia batida! 🎉'+(sobraTot>0?' +'+(pctTotReal-100)+'% ('+sobraTot.toLocaleString('pt-BR')+' pçs acima)':'')):pctTotReal+'% concluído · faltam '+Math.max(0,metaDiaTot-feitoTot).toLocaleString('pt-BR')+' pçs'):'Defina as metas de cada setor abaixo.'}${metaHoraTot>0?' · soma por hora: '+metaHoraTot.toLocaleString('pt-BR')+' pçs/h':''}<\/div>\n  <\/div>`;\n  host.innerHTML=`<div class=\"metas-wrap\">${total}${cards}<div class=\"meta-note\">As metas valem para todos. “Feito hoje” soma as peças dos lotes concluídos hoje em cada setor.<\/div><\/div>`;\n  host.querySelectorAll('input[data-meta]').forEach(inp=>inp.addEventListener('change',async()=>{\n    const k=inp.dataset.meta, c=inp.dataset.campo;\n    metas[k]=metas[k]||{hora:0,dia:0}; metas[k][c]=Math.max(0,Math.round(Number(inp.value||0)));\n    await salvarMetas(); renderMetas();\n  }));\n}\nfunction switchView(v){\n  const prod=v===\"prod\";\n  document.querySelectorAll(\".vtab\").forEach(b=>b.classList.toggle(\"active\",b.dataset.view===v));\n  if($(\"view-prod\"))$(\"view-prod\").style.display=prod?\"\":\"none\";\n  if($(\"view-metas\"))$(\"view-metas\").style.display=v===\"metas\"?\"\":\"none\";\n  if($(\"view-dias\"))$(\"view-dias\").style.display=v===\"dias\"?\"\":\"none\";\n  if($(\"fab-add\"))$(\"fab-add\").style.display=prod?\"\":\"none\";\n  if(v===\"metas\") renderMetas();\n  if(v===\"dias\") renderDias();\n}\ndocument.querySelectorAll(\".vtab\").forEach(b=>b.addEventListener(\"click\",()=>switchView(b.dataset.view)));\n\n/* ───── por dia ───── */\nlet diasSetor=\"todos\";\nfunction pecasPorPessoa(l,cfg){\n  const out={};\n  const grade=getGrade(l), porCor=l[cfg.fCor]||null;\n  const un=(l[cfg.fNome]||\"\").trim(), fb=(un&&un.indexOf(\",\")<0)?un:\"\";\n  if(grade.length){\n    grade.forEach(g=>{ const ck=g.cor||\"_geral\"; TAMS.forEach(t=>{ const q=g.tam[t]||0; if(q<=0) return; let nome=(porCor&&porCor[ck]&&porCor[ck][t])||fb; nome=(nome||\"\").trim(); if(!nome) return; out[nome]=(out[nome]||0)+q; }); });\n  }else{ let nome=(porCor&&porCor._geral&&porCor._geral._total)||fb; nome=(nome||\"\").trim(); if(nome) out[nome]=(out[nome]||0)+Number(l.qtdTotal||0); }\n  return out;\n}\nfunction renderDias(){\n  const host=$(\"dias-host\"); if(!host) return;\n  const inp=$(\"dias-mes\"); let mes=inp&&inp.value?inp.value:MES_ATUAL;\n  if(inp&&!inp.value) inp.value=mes;\n  document.querySelectorAll(\"#dias-chips .dia-chip\").forEach(b=>b.classList.toggle(\"active\",b.dataset.ds===diasSetor));\n  const setores=diasSetor===\"todos\"?ORDEM_SETORES:[diasSetor];\n  const dias={};\n  (Array.isArray(lotes)?lotes:[]).forEach(l=>{\n    setores.forEach(k=>{ const cfg=SETORES[k]; const dia=_emStr(l[cfg.fEm]); if(!dia||dia.slice(0,7)!==mes) return;\n      const pp=pecasPorPessoa(l,cfg); Object.keys(pp).forEach(nome=>{ (dias[dia]=dias[dia]||{}); dias[dia][nome]=(dias[dia][nome]||0)+pp[nome]; }); });\n  });\n  const ord=Object.keys(dias).sort((a,b)=>b.localeCompare(a));\n  const esc=x=>String(x==null?\"\":x).replace(/[<>&\"]/g,c=>({\"<\":\"&lt;\",\">\":\"&gt;\",\"&\":\"&amp;\",'\"':\"&quot;\"}[c]));\n  if(!ord.length){ host.innerHTML='<div class=\"empty\"><div class=\"empty-ico\">🗓️<\/div><div class=\"empty-t\">Sem registros<\/div><div class=\"empty-d\">Nenhuma peça concluída neste mês'+(diasSetor!==\"todos\"?\" em \"+SETORES[diasSetor].nome:\"\")+'.<\/div><\/div>'; return; }\n  host.innerHTML=ord.map(dia=>{\n    const pessoas=Object.keys(dias[dia]).map(n=>({nome:n,pecas:dias[dia][n]})).sort((a,b)=>b.pecas-a.pecas);\n    const tot=pessoas.reduce((sm,p)=>sm+p.pecas,0);\n    const d=new Date(dia+\"T12:00:00\");\n    const dl=d.toLocaleDateString(\"pt-BR\",{weekday:\"short\",day:\"2-digit\",month:\"short\"});\n    return '<div class=\"dia-card\"><div class=\"dia-head\"><span class=\"dia-data\">'+dl+'<\/span><span class=\"dia-tot\">'+tot.toLocaleString(\"pt-BR\")+' pçs<\/span><\/div>'+\n      '<div class=\"dia-list\">'+pessoas.map(p=>'<div class=\"dia-row\"><span class=\"dia-nome\">'+esc(p.nome)+'<\/span><span class=\"dia-q\">'+p.pecas.toLocaleString(\"pt-BR\")+'<\/span><\/div>').join(\"\")+'<\/div><\/div>';\n  }).join(\"\");\n}\nif($(\"dias-mes\")) $(\"dias-mes\").addEventListener(\"change\",renderDias);\ndocument.querySelectorAll(\"#dias-chips .dia-chip\").forEach(b=>b.addEventListener(\"click\",()=>{ diasSetor=b.dataset.ds; renderDias(); }));\n\n/* ───── auth flow ───── */\nconst ACESSO_EMAIL=\"acesso@jvconfeccao.app\", ACESSO_SENHA=\"jvconfeccao-acesso-2026\";\n$(\"login-form\").addEventListener(\"submit\",async e=>{\n  e.preventDefault();\n  loginError(\"\");\n  const btn=$(\"login-btn\");\n  btn.disabled=true; btn.textContent=\"Entrando…\";\n  try{\n    await setPersistence(auth,browserLocalPersistence);\n    try{ await signInWithEmailAndPassword(auth,ACESSO_EMAIL,ACESSO_SENHA); }\n    catch(err){ const code=err&&err.code||\"\"; if(code===\"auth/user-not-found\"||code===\"auth/invalid-credential\"||code===\"auth/invalid-login-credentials\"){ await createUserWithEmailAndPassword(auth,ACESSO_EMAIL,ACESSO_SENHA); } else throw err; }\n  }catch(err){\n    console.error(\"LOGIN_ERROR\",err);\n    loginError(authMsg(String(err?.code||\"\")));\n    btn.disabled=false; btn.textContent=\"Entrar\";\n  }\n});\n\n$(\"logout-btn\").addEventListener(\"click\",async()=>{\n  if(!confirm(\"Deseja sair?\")) return;\n  await signOut(auth);\n});\n\nonAuthStateChanged(auth,user=>{\n  if(user&&user.uid){\n    $(\"login-view\").style.display=\"none\";\n    $(\"app-view\").style.display=\"block\";\n    $(\"login-btn\").disabled=false; $(\"login-btn\").textContent=\"Entrar\";\n    loadColaboradores();\n    loadMetas();\n    carregar();\n  }else{\n    $(\"app-view\").style.display=\"none\";\n    $(\"login-view\").style.display=\"flex\";\n    lotes=[];\n  }\n});\n\n/* ───── ui wiring ───── */\n$(\"fab-add\").addEventListener(\"click\",abrirAdd);\n$(\"add-close\").addEventListener(\"click\",fecharAdd);\n$(\"add-overlay\").addEventListener(\"click\",e=>{ if(e.target===$(\"add-overlay\")) fecharAdd(); });\n$(\"add-form\").addEventListener(\"submit\",salvarLote);\n$(\"edit-close\").addEventListener(\"click\",fecharEdit);\n$(\"edit-overlay\").addEventListener(\"click\",e=>{ if(e.target===$(\"edit-overlay\")) fecharEdit(); });\n$(\"edit-form\").addEventListener(\"submit\",salvarEdicao);\n$(\"search\").addEventListener(\"input\",e=>{ busca=e.target.value.trim(); render(); });\n$(\"rv-select\").addEventListener(\"change\",e=>setRevisor(e.target.value));\n$(\"rv-manage\").addEventListener(\"click\",()=>{ renderColabList(); $(\"colab-overlay\").classList.add(\"show\"); setTimeout(()=>$(\"colab-input\").focus(),300); });\n$(\"colab-close\").addEventListener(\"click\",()=>$(\"colab-overlay\").classList.remove(\"show\"));\n$(\"colab-overlay\").addEventListener(\"click\",e=>{ if(e.target===$(\"colab-overlay\")) $(\"colab-overlay\").classList.remove(\"show\"); });\n$(\"colab-form\").addEventListener(\"submit\",e=>{ e.preventDefault(); addColaborador($(\"colab-input\").value); $(\"colab-input\").value=\"\"; $(\"colab-input\").focus(); });\n$(\"rank-head\").addEventListener(\"click\",()=>$(\"rank-card\").classList.toggle(\"collapsed\"));\nbindColorsWrap(\"f-colors\",\"f-total\");\nbindColorsWrap(\"e-colors\",\"e-total\");\ndocument.querySelectorAll(\".add-color-btn\").forEach(b=>b.addEventListener(\"click\",()=>{ addColorBlock(b.dataset.target,\"\",null,true); }));\n$(\"done-close\").addEventListener(\"click\",fecharConcluir);\n$(\"done-overlay\").addEventListener(\"click\",e=>{ if(e.target===$(\"done-overlay\")) fecharConcluir(); });\n$(\"done-confirm\").addEventListener(\"click\",confirmarConcluir);\n$(\"mn-prev\").addEventListener(\"click\",()=>shiftMes(-1));\n$(\"mn-next\").addEventListener(\"click\",()=>shiftMes(1));\n$(\"mn-label\").addEventListener(\"click\",()=>{ const i=$(\"mn-input\"); if(i.showPicker){try{i.showPicker();return;}catch(_e){}} i.click(); i.focus(); });\n$(\"mn-input\").addEventListener(\"change\",e=>{ if(e.target.value){ mesSel=e.target.value; syncMonthUI(); render(); } });\n$(\"mn-today\").addEventListener(\"click\",()=>{ mesSel=MES_ATUAL; syncMonthUI(); render(); });\nsyncMonthUI();\ndocument.querySelectorAll(\".chip\").forEach(c=>c.addEventListener(\"click\",()=>{\n  document.querySelectorAll(\".chip\").forEach(x=>x.classList.remove(\"active\"));\n  c.classList.add(\"active\");\n  filtro=c.dataset.filter;\n  render();\n}));\n<\/script>\n\n\n<\/body><\/html>"}, "entry": "revisao/Lotes Revisão"}
